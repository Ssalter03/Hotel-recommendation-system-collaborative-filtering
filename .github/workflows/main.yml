name: Test Packages Configuration

on: [push, pull_request]

jobs:
  test-java-hadoop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Cài đặt chính xác Java 11 thông qua action chính chủ của GitHub
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 2. Cài đặt các gói phụ khác từ packages.txt nếu bạn vẫn cần dùng (bỏ default-jdk ra khỏi file này)
      - name: Install other packages from packages.txt
        run: |
          sudo apt-get update
          xargs -a packages.txt sudo apt-get install -y --ignore-missing

      # 3. Tải và cấu hình Hadoop 3.3.6 (Bản dành cho Linux)
      - name: Set up Hadoop 3.3.6
        run: |
          wget https://apache.org
          tar -xzf hadoop-3.3.6.tar.gz
          echo "HADOOP_HOME=$GITHUB_WORKSPACE/hadoop-3.3.6" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/hadoop-3.3.6/bin" >> $GITHUB_PATH

      # 4. Xác minh lại toàn bộ môi trường
      - name: Verify Environment
        run: |
          java -version
          javac -version
          hadoop version
