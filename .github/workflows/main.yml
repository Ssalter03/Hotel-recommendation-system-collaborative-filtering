name: Test Packages Configuration

on: [push, pull_request]

jobs:
  test-java-hadoop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Cài đặt chính xác Java 11 từ GitHub Actions
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 2. Tải và giải nén Hadoop từ đường dẫn lưu trữ cố định (Link trực tiếp file tar.gz)
      - name: Set up Hadoop 3.3.6
        run: |
          wget https://apache.org
          tar -xzf hadoop-3.3.6.tar.gz
          echo "HADOOP_HOME=$GITHUB_WORKSPACE/hadoop-3.3.6" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/hadoop-3.3.6/bin" >> $GITHUB_PATH

      # 3. Kiểm tra kết quả tích hợp hệ thống
      - name: Verify Environment
        run: |
          java -version
          javac -version
          hadoop version
