name: Test Packages Configuration

on: [push, pull_request]

jobs:
  test-java-hadoop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Khởi tạo Java 11 từ nguồn chính thống của GitHub Actions
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 2. Xử lý cài đặt các package phụ trợ nếu có trong file packages.txt
      - name: Install other packages from packages.txt
        run: |
          sudo apt-get update
          if [ -s packages.txt ]; then
            xargs -a packages.txt sudo apt-get install -y --ignore-missing
          fi

      # 3. Sử dụng link Apache Archive chính thức để đảm bảo luôn tải được file Hadoop 3.3.6
      - name: Set up Hadoop 3.3.6
        run: |
          wget https://apache.org
          tar -xzf hadoop-3.3.6.tar.gz
          echo "HADOOP_HOME=$GITHUB_WORKSPACE/hadoop-3.3.6" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/hadoop-3.3.6/bin" >> $GITHUB_PATH

      # 4. Kiểm tra thành quả tích hợp hệ thống
      - name: Verify Environment
        run: |
          java -version
          javac -version
          hadoop version
